/* Layout: product shell — dark icon rail · white header · dotted canvas with floating settings card and right drawer.
   Single light theme on purpose: this replicates a light-only data tool. */
:root {
  color-scheme: light;
  --ink: #1D2939; --ink-2: #344054; --ink-3: #475467; --ink-4: #667085; --ink-5: #98A2B3;
  --line: #D0D5DD; --line-2: #E4E7EC; --line-3: #F2F4F7;
  --canvas: #F3F4F7; --surface: #FFFFFF; --surface-2: #F9FAFB;
  --rail: #0F1526; --rail-2: #1F2A40; --rail-on: #53389E;
  --brand: #7F56D9; --brand-hover: #6941C6; --brand-50: #F9F5FF; --brand-100: #F4EBFF; --brand-200: #E9D7FE;
  --ok: #079455; --ok-bg: #ECFDF3; --ok-dot: #17B26A;
  --err: #D92D20; --err-bg: #FEF3F2; --err-dot: #F04438;
  --warn: #B54708; --warn-bg: #FFFAEB;
  --font: 'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --shadow-xs: 0 1px 2px rgba(16,24,40,.05);
  --shadow-md: 0 4px 8px -2px rgba(16,24,40,.08), 0 2px 4px -2px rgba(16,24,40,.04);
  --shadow-lg: 0 20px 24px -4px rgba(16,24,40,.08), 0 8px 8px -4px rgba(16,24,40,.03);

}
html, body, #root { height: 100%; }
body { background: var(--canvas); color: var(--ink); font-family: var(--font); font-size: 14px; letter-spacing: -0.01em; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--brand-200); outline-offset: 1px; }
b { font-weight: 600; }

.app { display: grid; grid-template-columns: 72px 1fr; height: 100%; min-width: 0; }

/* rail */
.sidebar { background: var(--rail); display: flex; flex-direction: column; align-items: center; gap: 4px; padding-block: 18px 16px; }
.logo { height: 28px; display: grid; place-items: center; margin-bottom: 12px; }

.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; position: relative; }

/* header */

.h-left, .h-right { display: flex; align-items: center; gap: 10px; min-width: 0; }
.h-right { gap: 12px; flex: none; }
.h-title { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; margin: 0 2px 0 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 280px; cursor: text; border-radius: 4px; padding: 2px 4px; }
.h-title:hover { background: var(--line-3); }
.h-title.static { cursor: default; padding-left: 8px; }
.h-title.static:hover { background: none; }
.rename { height: 32px; width: 260px; font-weight: 600; }

.h-env { font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.pubbadge { font-size: 11px; font-weight: 500; border-radius: 999px; padding: 3px 8px; white-space: nowrap; margin-left: 4px; }
.b-draft { background: var(--line-3); color: var(--ink-3); }

/* buttons */
.btn { height: 36px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; padding: 0 14px; border-radius: var(--r); font-size: 14px; font-weight: 600; white-space: nowrap; transition: background .15s, border-color .15s, color .15s; }
.btn-pri { background: var(--brand); color: #fff; box-shadow: var(--shadow-xs); }

.grow { flex: 1; }

.iconbtn { width: 32px; height: 32px; display: grid; place-items: center; border-radius: var(--r); color: var(--ink-3); flex: none; }

.menu { position: absolute; top: calc(100% + 6px); left: 0; min-width: 190px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 8px; box-shadow: var(--shadow-lg); padding: 4px; z-index: 50; }
.menu.right { left: auto; right: 0; }
.menu button { display: flex; align-items: center; gap: 9px; width: 100%; padding: 9px 10px; border-radius: 5px; font-size: 13px; color: var(--ink-2); text-align: left; }
.menu button:hover { background: var(--surface-2); }
.runpill { height: 36px; display: inline-flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; border-radius: var(--r); background: var(--brand-50); color: var(--brand); font-weight: 600; font-size: 14px; }
.stopbtn { width: 24px; height: 24px; border-radius: 5px; display: grid; place-items: center; background: #fff; border: 1px solid var(--line-2); }

/* spinners */
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--brand-200); border-top-color: var(--brand); animation: rot .8s linear infinite; flex: none; }
.spin.sm { width: 10px; height: 10px; border-width: 1.5px; }
.spin.light { border-color: rgba(255,255,255,.35); border-top-color: #fff; }

/* canvas */
.canvas { flex: 1; position: relative; min-height: 0; background: var(--canvas); overflow: hidden; }
.react-flow__handle.hdl { width: 7px; height: 7px; min-width: 0; min-height: 0; background: #667085; border: 0; }
.react-flow__edge-path { stroke-linecap: round; }

/* nodes */
.node { position: relative; width: 200px; background: var(--surface); border: 1px solid var(--line); border-radius: 4px; transition: border-color .15s, box-shadow .15s; }
.node:hover, .node.editing { border-color: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 12%, transparent); }
.node.running { border-color: var(--brand-200); }
.ticon { display: inline-grid; place-items: center; border-radius: 5px; flex: none; }
.trig-main { height: 50px; display: flex; align-items: center; gap: 10px; padding: 0 12px; }
.trig-name { font-size: 15px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task-main { display: flex; align-items: flex-start; gap: 8px; padding: 12px; min-height: 63px; box-sizing: border-box; }
.task-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.task-type { font-size: 13px; color: var(--ink-4); }
.task-name { font-size: 15px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.task-foot { display: flex; align-items: center; justify-content: space-between; height: 28px; padding: 0 12px; background: var(--surface-2); border-top: 1px solid var(--line-3); border-radius: 0 0 4px 4px; }
.viewlogs { font-size: 11px; color: var(--ink-4); }
.viewlogs:hover { color: var(--brand); text-decoration: underline; }
.st { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-variant-numeric: tabular-nums; }
.st .dot { width: 7px; height: 7px; border-radius: 50%; }
.st-ok { color: var(--ok); } .st-ok .dot { background: var(--ok-dot); }
.st-fail { color: var(--err); } .st-fail .dot { background: var(--err-dot); }
.st-ab { color: var(--ink-4); } .st-ab .dot { background: var(--ink-5); }
.st-run { color: var(--brand); }
.st-none { color: var(--ink-4); }

.toolbar { position: absolute; top: -13px; right: 8px; display: flex; align-items: center; opacity: 0; transform: translateY(3px); transition: opacity .15s, transform .15s; pointer-events: none; }
.node:hover .toolbar, .node.editing .toolbar { opacity: 1; transform: none; pointer-events: auto; }
.tb { width: 24px; height: 24px; display: grid; place-items: center; background: var(--surface); border-radius: 5px; box-shadow: 0 1px 3px rgba(16,24,40,.14); }
.tb:hover { background: color-mix(in srgb, currentColor 12%, #fff); }
.tbline { width: 6px; height: 1px; background: color-mix(in srgb, var(--c) 50%, transparent); }

.addafter { position: absolute; left: 100%; top: 26px; transform: translateY(-50%); display: flex; align-items: center; opacity: 0; pointer-events: none; transition: opacity .15s; }
.task .addafter { top: 32px; }
.addafter.show, .node:hover .addafter { opacity: 1; pointer-events: auto; }
.addline { width: 18px; height: 1px; background: #98A2B3; }
.addbtn { width: 26px; height: 26px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; color: var(--ink-2); box-shadow: var(--shadow-xs); transition: background .15s, color .15s, border-color .15s; }
.addbtn:hover { background: var(--brand); border-color: var(--brand); color: #fff; }
.addafter.pulse .addbtn { animation: ring 1.8s ease-out infinite; background: var(--brand); border-color: var(--brand); color: #fff; }
.addafter.pulse .addbtn:hover { background: var(--brand-hover); border-color: var(--brand-hover); color: #fff; }
.addhint { margin-left: 8px; font-size: 12px; font-weight: 500; color: var(--brand); background: var(--brand-50); border: 1px solid var(--brand-100); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
@keyframes ring { 0% { box-shadow: 0 0 0 0 rgba(127,86,217,.35); } 70% { box-shadow: 0 0 0 9px rgba(127,86,217,0); } 100% { box-shadow: 0 0 0 0 rgba(127,86,217,0); } }

.ph { width: 260px; display: flex; align-items: center; gap: 12px; padding: 14px; border: 1.5px dashed #B9BFCC; border-radius: 6px; background: rgba(255,255,255,.7); cursor: pointer; transition: border-color .15s, background .15s; }
.ph:hover { border-color: var(--brand); background: #fff; }
.ph-plus { width: 36px; height: 36px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; animation: ring 1.8s ease-out infinite; flex: none; }
.ph-t { font-size: 15px; font-weight: 600; color: var(--ink); }
.ph-s { font-size: 12px; color: var(--ink-4); margin-top: 2px; }

/* zoom + fab */
.zoombar { position: absolute; left: 16px; bottom: 16px; z-index: 5; display: flex; align-items: center; gap: 8px; }
.zgroup { display: flex; align-items: center; gap: 4px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 6px; padding: 2px 8px 2px 2px; box-shadow: var(--shadow-xs); }
.zb { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 5px; color: var(--ink-3); background: var(--surface); }
.zoombar > .tipwrap > .zb { border: 1px solid var(--line-2); box-shadow: var(--shadow-xs); width: 30px; height: 30px; }
.zb:hover { background: var(--line-3); color: var(--ink); }
.zpct { font-size: 11px; color: var(--ink-4); width: 32px; text-align: right; font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 64px; height: 3px; border-radius: 3px; background: linear-gradient(to right, var(--ink-4) var(--p), var(--line) var(--p)); margin: 0 2px; cursor: pointer; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 11px; height: 11px; border-radius: 50%; background: #475467; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--line); }
input[type=range]::-moz-range-thumb { width: 9px; height: 9px; border-radius: 50%; background: #475467; border: 2px solid #fff; }
.fab { position: absolute; right: 20px; bottom: 20px; z-index: 5; width: 40px; height: 40px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; box-shadow: var(--shadow-md); }
.canvas > .tipwrap { position: absolute; right: 20px; bottom: 20px; z-index: 5; }
.canvas > .tipwrap .fab { position: static; }
.fab:hover { background: var(--brand-hover); }

/* tooltips */
.tipwrap { position: relative; display: inline-flex; }
.tip { position: absolute; bottom: calc(100% + 7px); left: 50%; transform: translateX(-50%) translateY(2px); background: var(--surface); color: var(--ink-2); font-size: 12px; font-weight: 500; padding: 6px 9px; border-radius: 6px; box-shadow: 0 4px 12px rgba(16,24,40,.12), 0 0 0 1px rgba(16,24,40,.04); white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity .12s, transform .12s; z-index: 60; letter-spacing: 0; }
.tipwrap:hover > .tip, .tipwrap:focus-within > .tip { opacity: 1; transform: translateX(-50%); }
.canvas > .tipwrap > .tip { left: auto; right: 0; transform: none; }
.header .tipwrap > .tip, .sp-head .tipwrap > .tip { bottom: auto; top: calc(100% + 7px); }

/* settings panel — docked right column (Figma 7302:53077) */
.settings { position: absolute; top: 0; right: 0; bottom: 0; z-index: 6; width: 300px; background: var(--surface); border-left: 1px solid var(--line-2); display: flex; flex-direction: column; animation: slidein .2s cubic-bezier(.2,.8,.2,1); }
.sp-scroll { flex: 1; overflow: auto; padding: 0 16px; }
.sp-sec { padding-block: 16px; border-bottom: 1px solid var(--line-2); }
.sp-sec:last-child { border-bottom: 0; }
.sp-first { padding-top: 14px; }
.sp-fields { display: flex; flex-direction: column; gap: 16px; }
.sp-sechead { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 24px; }
.sp-sechead .iconbtn { color: var(--ink-2); }
.sp-lbl { font-size: 13px; color: var(--ink-2); }
.sp-sectitle { font-size: 13px; font-weight: 600; color: var(--ink); }
.sp-desc { margin: 4px 0 0; font-size: 11.5px; line-height: 1.45; color: var(--ink-4); }
.sp-secbody { margin-top: 12px; }
.sp-nextval { font-size: 13px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
.sp-nextval.muted { color: var(--ink-3); font-weight: 500; }
.sp-trig { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 12px; color: var(--ink-4); }
.sp-trig .ticon { border-radius: 4px; }
.settings .flabel { font-size: 13px; }
.settings .inp, .settings .selwrap select { height: 34px; font-size: 13px; }
.settings .row2 { gap: 12px; }
.sp-num { width: 50%; }
.envsel { position: relative; }
.envsel .selwrap select { padding-right: 84px; }
.envsel .envtag { position: absolute; right: 36px; top: 50%; transform: translateY(-50%); pointer-events: none; }
.sp-foot { flex: none; margin: 0; padding: 12px 16px 16px; font-size: 11.5px; line-height: 1.45; color: var(--ink-5); }
.settings .tipwrap > .tip { bottom: auto; top: calc(100% + 6px); left: auto; right: 0; transform: none; }
.sp-open { position: absolute; top: 16px; right: 16px; z-index: 6; height: 34px; display: inline-flex; align-items: center; gap: 7px; padding: 0 12px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 6px; box-shadow: var(--shadow-xs); font-size: 13px; font-weight: 500; color: var(--ink-2); }
.sp-open:hover { background: var(--surface-2); }
.canvas.docked > .tipwrap { right: 320px; }

/* drawer */
.drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(480px, 92%); z-index: 15; background: var(--surface); border-left: 1px solid var(--line-2); box-shadow: -12px 0 32px -8px rgba(16,24,40,.12); display: flex; flex-direction: column; animation: slidein .22s cubic-bezier(.2,.8,.2,1); }
@keyframes slidein { from { transform: translateX(24px); opacity: 0; } }
.dhead { display: flex; align-items: center; justify-content: space-between; padding: 12px 12px 12px 16px; border-bottom: 1px solid var(--line-2); flex: none; }

.dtitle > span:not(.ticon):not(.dtag) { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dtag { font-size: 11px; font-weight: 500; color: var(--ink-3); background: var(--line-3); padding: 2px 7px; border-radius: 999px; }
.tabs { display: flex; gap: 4px; padding: 0 16px; border-bottom: 1px solid var(--line-2); flex: none; }
.tabs button { padding: 11px 14px 9px; font-size: 14px; font-weight: 500; color: var(--ink-4); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button.on { color: var(--ink); font-weight: 600; border-bottom-color: var(--brand); }
.dbody { flex: 1; overflow: auto; padding: 20px 16px; display: flex; flex-direction: column; gap: 18px; }
.dbody.list { padding: 8px 8px 16px; gap: 0; }
.dsec { padding: 8px 0; }
.dsec-t { font-size: 12px; color: var(--ink-4); padding: 6px 8px 8px; font-weight: 500; }
.dsep { border: 0; border-top: 1px solid var(--line-2); margin: 6px 8px; }
.pick { width: 100%; display: flex; align-items: center; gap: 12px; padding: 10px 8px; border-radius: 6px; text-align: left; transition: background .12s; }
.pick:hover { background: var(--surface-2); }
.pick:hover > svg { transform: translateX(2px); }
.pick > svg { transition: transform .12s; flex: none; }
.pick-text { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.pick-t { font-size: 14px; font-weight: 600; }
.pick-d { font-size: 12px; color: var(--ink-4); }
.dnote { font-size: 12px; color: var(--ink-4); padding: 8px; margin: 4px 0 0; border-top: 1px solid var(--line-3); }
.dfoot { display: flex; gap: 12px; padding: 14px 16px; border-top: 1px solid var(--line-2); flex: none; }
.dfoot .btn { height: 40px; }

/* fields */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.flabel { font-size: 14px; color: var(--ink-2); display: flex; align-items: center; gap: 4px; }
.req { color: var(--err-dot); }
.fhint { font-size: 12px; color: var(--ink-4); line-height: 1.4; }
.ferr { font-size: 12px; color: var(--err); display: flex; align-items: center; gap: 5px; }

.rtable { min-width: 900px; }

/* ---------------- schedule logic ---------------- */
const pad = (n) => String(n).padStart(2, '0');
function ruleFromSchedule(c) {
  if (c.mode === 'custom') {
    const [h, m] = (c.time || '05:00').split(':').map(Number);
    if (c.every === 'hour') return { ok: true, freq: 'hour', h: 0, m: Number(c.minute) };
    return { ok: true, freq: c.every, h, m, dow: Number(c.dow), dom: Number(c.dom) };
  }
  const f = (c.cron || '').trim().split(/\s+/);
  if (f.length !== 5) return { ok: false, error: 'Enter 5 fields separated by spaces: minute hour day(month) month day(week).' };
  const [mi, hr, dom, mon, dow] = f;
  const num = (v, lo, hi) => /^\d+$/.test(v) && +v >= lo && +v <= hi;
  const any = (v) => v === '*' || v === '?';
  const valid = /^[\d*?,\/\-]+$/;
  if (!f.every((x) => valid.test(x))) return { ok: false, error: 'Use digits, *, ?, commas, ranges or steps only.' };
  if (!num(mi, 0, 59)) return { ok: true, freq: 'custom' };
  if (any(hr) && any(dom) && any(mon) && any(dow)) return { ok: true, freq: 'hour', h: 0, m: +mi };
  if (!num(hr, 0, 23) || !any(mon)) return { ok: true, freq: 'custom' };
  if (num(dom, 1, 28) && any(dow)) return { ok: true, freq: 'month', h: +hr, m: +mi, dom: +dom };
  if (any(dom) && num(dow, 0, 6)) return { ok: true, freq: 'week', h: +hr, m: +mi, dow: +dow };
  if (any(dom) && any(dow)) return { ok: true, freq: 'day', h: +hr, m: +mi };
  return { ok: true, freq: 'custom' };
}
function nextRunDate(rule, tz) {
  if (!rule.ok || rule.freq === 'custom') return null;
  const now = new Date(Date.now() + tz.off * 60000);
  const base = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
  if (rule.freq === 'hour') {
    let t = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate(), now.getUTCHours(), rule.m);
    if (t <= now.getTime()) t += 3600000;
    return new Date(t);
  }
  for (let d = 0; d < 40; d++) {
    const t = new Date(base + d * 86400000 + (rule.h * 60 + rule.m) * 60000);
    if (t.getTime() <= now.getTime()) continue;
    if (rule.freq === 'week' && t.getUTCDay() !== rule.dow) continue;
    if (rule.freq === 'month' && t.getUTCDate() !== rule.dom) continue;
    return t;
  }
  return null;
}
function formatZoned(t, tz) {
  const now = new Date(Date.now() + tz.off * 60000);
  const day0 = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
  const diff = Math.floor((t.getTime() - day0) / 86400000);
  const day = diff === 0 ? 'Today' : diff === 1 ? 'Tomorrow'
    : `${DAYS[t.getUTCDay()].slice(0, 3)} ${t.getUTCDate()} ${MONTHS[t.getUTCMonth()]}`;
  return `${day}, ${pad(t.getUTCHours())}:${pad(t.getUTCMinutes())} ${tz.abbr}`;
}
function scheduleSummary(c) {
  const rule = ruleFromSchedule(c);
  const tz = TZS.find((z) => z.id === c.tz) || TZS[0];
  if (!rule.ok) return { ok: false, error: rule.error };
  const at = `${pad(rule.h)}:${pad(rule.m)}`;
  let parts;
  if (rule.freq === 'hour') parts = [['Your trigger will run '], ['every hour', 1], [' at minute '], [`:${pad(rule.m)}`, 1]];
  else if (rule.freq === 'day') parts = [['Your trigger will run '], ['every day', 1], [' at '], [at, 1]];
  else if (rule.freq === 'week') parts = [['Your trigger will run '], [`every ${DAYS[rule.dow]}`, 1], [' at '], [at, 1]];
  else if (rule.freq === 'month') parts = [['Your trigger will run on '], [`day ${rule.dom} of every month`, 1], [' at '], [at, 1]];
  else parts = [['Your trigger will run on a '], ['custom CRON schedule', 1]];
  parts.push([` ${tz.abbr}`, 1]);
  const next = nextRunDate(rule, tz);
  return { ok: true, parts, next: next ? formatZoned(next, tz) : null };
}
const DEFAULT_SCHEDULE = { mode: 'custom', every: 'day', time: '05:00', minute: '0', dow: '1', dom: '1', tz: 'UTC', cron: '0 5 * * *' };

function nextRunLabel(trigger) {
  if (!trigger) return { text: 'Add a trigger to schedule runs', muted: true };
  const c = trigger.cfg || {};
  if (trigger.type === 'manual') return { text: 'Only when run manually', muted: true };
  if (trigger.type === 'webhook') return { text: 'On each webhook request', muted: true };
  if (trigger.type === 'pr') return { text: `On new pull requests to ${c.branch || 'main'}`, muted: true };
  const s = scheduleSummary(c.schedule || DEFAULT_SCHEDULE);
  return s.next ? { text: s.next } : { text: 'Per CRON schedule', muted: true };
}

}

function CommandList({ value, onChange }) {
  const list = value.length ? value : [];
  const [focusIdx, setFocusIdx] = useState(null);
  const [dragIdx, setDragIdx] = useState(null);
  const [overIdx, setOverIdx] = useState(null);
  const refs = useRef([]);
  useEffect(() => { if (focusIdx != null && refs.current[focusIdx]) { refs.current[focusIdx].focus(); setFocusIdx(null); } }, [focusIdx, list.length]);
  const update = (i, v) => onChange(list.map((c, k) => (k === i ? v : c)));
  const remove = (i) => { onChange(list.filter((_, k) => k !== i)); setFocusIdx(Math.max(0, Math.min(i, list.length - 2))); };
  const add = (at = list.length) => { const n = [...list]; n.splice(at, 0, ''); onChange(n); setFocusIdx(at); };
  const move = (from, to) => { if (to < 0 || to >= list.length || from === to) return; const n = [...list]; const [x] = n.splice(from, 1); n.splice(to, 0, x); onChange(n); };
  return html`<div className="cmdbox">
    ${list.length > 0 && html`<div className="cmdlist">${list.map((c, i) => html`<div key=${i}
        className=${'cmdrow' + (dragIdx === i ? ' dragging' : '') + (overIdx === i && dragIdx !== i ? ' over' : '')}
        onDragOver=${(e) => { if (dragIdx == null) return; e.preventDefault(); setOverIdx(i); }}
        onDrop=${(e) => { e.preventDefault(); if (dragIdx != null) move(dragIdx, i); setDragIdx(null); setOverIdx(null); }}>
      <input id=${'f-cmd-' + i} ref=${(el) => { refs.current[i] = el; }} className="inp mono" value=${c} placeholder="e.g. dbt build --select marts"
        aria-label=${`dbt command ${i + 1}`} autoComplete="off" spellCheck=${false}
        onChange=${(e) => update(i, e.target.value)}
        onKeyDown=${(e) => { if (e.key === 'Enter') { e.preventDefault(); add(i + 1); }
          if (e.key === 'Backspace' && !c && list.length > 1) { e.preventDefault(); remove(i); } }} />
      <button type="button" className="cmdbtn" aria-label=${`Remove command ${i + 1}`} onClick=${() => remove(i)}><${Icon} name="x" size=${15} /></button>
      <button type="button" className="cmdbtn grip" draggable="true" aria-label=${`Reorder command ${i + 1}. Use the arrow keys to move it.`}
        onDragStart=${(e) => { setDragIdx(i); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', String(i)); } catch (_) {} }}
        onDragEnd=${() => { setDragIdx(null); setOverIdx(null); }}
        onKeyDown=${(e) => { if (e.key === 'ArrowUp') { e.preventDefault(); move(i, i - 1); setTimeout(() => document.querySelectorAll('.cmdrow .grip')[i - 1]?.focus(), 0); }
          if (e.key === 'ArrowDown') { e.preventDefault(); move(i, i + 1); setTimeout(() => document.querySelectorAll('.cmdrow .grip')[i + 1]?.focus(), 0); } }}>
        <${Icon} name="grip" size=${15} /></button>
    </div>`)}</div>`}
    <button type="button" className="btn btn-sec addcmd" onClick=${() => add()}><${Icon} name="plus" size=${15} />Add command</button>
  </div>`;
}

function SettingsPanel({ pipe, setPipe, trigger, paused, onCollapse, toast }) {
  const nr = paused ? { text: 'Paused. Resume the pipeline to schedule runs.', muted: true } : nextRunLabel(trigger);
  const env = ENVS.find((e) => e.id === pipe.env);
  const [name, setName] = useState(pipe.name);
  const [nameErr, setNameErr] = useState('');
  useEffect(() => { setName(pipe.name); setNameErr(''); }, [pipe.name]);
  const commitName = () => {
    const v = name.trim();
    if (!v) { setNameErr('Enter a pipeline name.'); return; }
    if (v !== pipe.name) { setPipe({ name: v }); toast('Pipeline renamed'); }
  };
  const tMax = pipe.timeoutUnit === 'hours' ? 72 : 1440;
  const tHint = pipe.timeoutUnit
    ? `Runs still going after ${pipe.timeout} ${pipe.timeoutUnit === 'hours' ? (pipe.timeout === 1 ? 'hour' : 'hours') : (pipe.timeout === 1 ? 'minute' : 'minutes')} are stopped and marked failed.`
    : 'Choose a unit to set the time out.';

  return html`<aside className="settings" aria-label="Pipeline settings">
    <div className="sp-scroll">
      <section className="sp-sec sp-first">
        <div className="sp-sechead">
          <span className="sp-lbl">Next run</span>
          <${Tip} label="Hide settings"><button className="iconbtn sm" aria-label="Hide settings panel" onClick=${onCollapse}><${Icon} name="panel" size=${15} /></button></${Tip}>
        </div>
        <div className=${'sp-nextval' + (nr.muted ? ' muted' : '')}>${nr.text}</div>
        ${trigger && html`<div className="sp-trig"><${TypeIcon} type=${trigger.type} size=${16} />${trigger.name}</div>`}
      </section>

      <section className="sp-sec sp-fields">
        <${Field} label="Pipeline name" htmlFor="s-name" error=${nameErr}>
          <${Input} id="s-name" value=${name} invalid=${nameErr} onChange=${(v) => { setName(v); setNameErr(''); }}
            onBlur=${commitName} onKeyDown=${(e) => { if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape') { setName(pipe.name); setNameErr(''); } }} />
        </${Field}>
        <${Field} label="Compute" htmlFor="s-compute">
          <${Select} id="s-compute" value=${pipe.compute} onChange=${(v) => setPipe({ compute: v })}
            options=${COMPUTE.map((c) => ({ value: c.id, label: `${c.label} (${c.detail})` }))} /></${Field}>
        <${Field} label="Environment" htmlFor="s-env">
          <div className="envsel"><${Select} id="s-env" value=${pipe.env} onChange=${(v) => setPipe({ env: v })}
            options=${ENVS.map((e) => ({ value: e.id, label: e.label }))} /><span className=${'envtag env-' + env.id}>${env.short}</span></div></${Field}>
      </section>

      <${OptionalSection} id="s-timeout" title="Time out" on=${pipe.timeoutOn}
        desc=${pipe.timeoutOn ? null : 'Stop runs that take longer than a set time.'}
        onAdd=${() => setPipe({ timeoutOn: true })} onRemove=${() => setPipe({ timeoutOn: false })}>
        <${Field} label="Time out in" htmlFor="s-timeout-val" hint=${tHint}>
          <div className="row2">
            <input id="s-timeout-val" type="number" min="1" max=${tMax} className="inp" value=${pipe.timeout}
              onChange=${(e) => setPipe({ timeout: Math.max(1, Math.min(tMax, Math.round(Number(e.target.value)) || 1)) })} />
            <${Select} id="s-timeout-unit" value=${pipe.timeoutUnit} placeholder="Select"
              onChange=${(v) => setPipe({ timeoutUnit: v, timeout: Math.min(pipe.timeout, v === 'hours' ? 72 : 1440) })}
              options=${[{ value: 'minutes', label: 'Minutes' }, { value: 'hours', label: 'Hours' }]} />
          </div>
        </${Field}>
      </${OptionalSection}>

      <${OptionalSection} id="s-conc" title="Concurrent job runs" on=${pipe.concurrencyOn}
        desc="Allow multiple instances of the job to run at the same time."
        onAdd=${() => setPipe({ concurrencyOn: true })} onRemove=${() => setPipe({ concurrencyOn: false })}>
        <${Field} label="Maximum runs at once" htmlFor="s-conc-val" hint=${`Up to ${pipe.concurrency} runs of this pipeline can overlap.`}>
          <input id="s-conc-val" type="number" min="2" max="10" className="inp sp-num" value=${pipe.concurrency}
            onChange=${(e) => setPipe({ concurrency: Math.max(2, Math.min(10, Math.round(Number(e.target.value)) || 2)) })} />
        </${Field}>
      </${OptionalSection}>
    </div>
    <p className="sp-foot">All your changes are automatically saved and go live once your pipeline is published.</p>
  </aside>`;
}

function Modal({ title, children, onClose, width = 440 }) {
  useEffect(() => { const k = (e) => e.key === 'Escape' && onClose && onClose(); window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k); }, [onClose]);
  return html`<div className="scrim" onMouseDown=${(e) => { if (e.target === e.currentTarget && onClose) onClose(); }}>
    <div className="modal" role="dialog" aria-modal="true" aria-label=${title} style=${{ width }}>${children}</div></div>`;
}
function ConfirmModal({ title, body, confirmLabel, danger, onConfirm, onCancel, icon = 'alert' }) {
  return html`<${Modal} title=${title} onClose=${onCancel} width=${420}>

  </${Modal}>`;
}

/* ---------------- name modal (create + rename) ---------------- */
function NameModal({ mode = 'create', initial = '', taken = [], onSubmit, onCancel }) {
  const [name, setName] = useState(initial);
  const [err, setErr] = useState('');
  const create = mode === 'create';
  const submit = (e) => { e.preventDefault(); const n = name.trim();
    if (!n) return setErr('Enter a name for your pipeline.');
    if (n.length > 60) return setErr('Keep the name under 60 characters.');
    if (n !== initial && taken.some((t) => t.toLowerCase() === n.toLowerCase())) return setErr(`A pipeline called “${n}” already exists.`);
    onSubmit(n); };
  return html`<${Modal} title=${create ? 'New pipeline' : 'Rename pipeline'} onClose=${onCancel}>
    <form onSubmit=${submit} noValidate>
      <div className="m-head"><span className="m-icon"><${Icon} name=${create ? 'job' : 'pencil'} size=${16} color="#7F56D9" /></span>
        <button type="button" className="iconbtn" aria-label="Close" onClick=${onCancel}><${Icon} name="x" size=${18} /></button></div>
      <h2 className="m-title">${create ? 'Create a new pipeline' : 'Rename pipeline'}</h2>
      <p className="m-sub">${create ? 'Give it a name you’ll recognise in the pipelines list. You can change it later.' : 'Runs, schedules and alerts stay attached to this pipeline.'}</p>
      <${Field} label="Pipeline name" required htmlFor="np-name" error=${err}>
        <${Input} id="np-name" value=${name} onChange=${(v) => { setName(v); setErr(''); }} placeholder="e.g. shopify-orders-daily" invalid=${err} autoFocus=${true} autoComplete="off" />
      </${Field}>
      <div className="m-foot"><button type="button" className="btn btn-sec" onClick=${onCancel}>Cancel</button>
        <button type="submit" className="btn btn-pri">${create ? 'Create pipeline' : 'Save name'}</button></div>
    </form></${Modal}>`;
}

function buildGraph(pid, trig, tasks, published = false) {
  const ids = [];
  const nodes = [];
  const tid = `${pid}-t`;
  nodes.push({ id: tid, type: trig.type, name: trig.name, parent: null, cfg: trig.cfg || {}, status: null, duration: '', logs: [], ran: false, published });
  tasks.forEach((t, i) => {
    const id = `${pid}-${i + 1}`; ids.push(id);
    const parent = t.after == null ? tid : ids[t.after];
    nodes.push({ id, type: t.type, name: t.name, parent, cfg: { description: '', ...t.cfg }, status: t.status || null,
      duration: t.duration || '', logs: t.logs || [], ran: !!t.status, published });
  });
  return nodes;
}

function seedPipelines() {

/* layout for saved graphs: column per depth, first child shares its parent's row */
function layoutGraph(nodes) {
  const pos = {}; let row = 0;
  const trig = nodes.find((n) => !n.parent);
  if (!trig) return pos;
  const walk = (n, depth, r) => {
    const kind = TYPES[n.type].kind;
    pos[n.id] = { x: depth * 310, y: r * 112 + (kind === 'trigger' ? 6 : 0) };
    const kids = nodes.filter((c) => c.parent === n.id);
    kids.forEach((c, i) => { if (i > 0) row += 1; walk(c, depth + 1, i === 0 ? r : row); });
  };
  walk(trig, 0, 0);
  return pos;
}

/* ---------------- run history ---------------- */
const CU_RATE = { xs: 25, s: 50, m: 100, l: 200 }; // CUs per hour
const TRIGGER_RUN_LABEL = { scheduled: 'On schedule', manual: 'Manual', webhook: 'Webhook', pr: 'Pull request' };
const RUN_STATUS = {
  running: { label: 'Running', cls: 'rs-run' },
  success: { label: 'Succeeded', cls: 'rs-ok' },
  failed: { label: 'Failed', cls: 'rs-fail' },
  aborted: { label: 'Stopped', cls: 'rs-ab' },
};
const TASK_STATUS_LABEL = { success: 'Succeeded', failed: 'Failed', aborted: 'Skipped', running: 'Running' };
function strHash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
const runIdFor = (pid, seq) => `${strHash(pid + 'run').toString(16).padStart(8, '0').slice(0, 8)}-${5100 + seq}`;
const cusFor = (compute, sec) => Math.round(((CU_RATE[compute] || 25) * sec) / 360) / 10;
function cadenceMs(trig) {
  if (!trig) return 3 * 86400000;
  if (trig.type === 'scheduled') { const e = (trig.cfg.schedule || DEFAULT_SCHEDULE).every; return e === 'hour' ? 3600000 : e === 'week' ? 7 * 86400000 : e === 'month' ? 30 * 86400000 : 86400000; }
  return { webhook: 5 * 3600000, pr: 2 * 86400000, manual: 3 * 86400000 }[trig.type];
}
const ERRORS = {
  ingestion: 'Connection to source timed out after 300s',
  modeling: 'Compilation Error in model stg_orders: depends on a node named "raw_orders" which was not found',
  python: 'Process exited with code 1: KeyError: \'rate\'',
  job: 'Child pipeline finished with 1 failed task',
};
// one run's per-task results; failAt = index into task list
function taskResults(taskNodes, failAt) {
  const failedId = failAt != null ? taskNodes[failAt]?.id : null;
  const downstream = new Set();
  if (failedId) { const walk = (id) => taskNodes.filter((t) => t.parent === id).forEach((t) => { downstream.add(t.id); walk(t.id); }); walk(failedId); }
  return taskNodes.map((t) => ({ id: t.id, name: t.name, type: t.type,
    status: t.id === failedId ? 'failed' : downstream.has(t.id) ? 'aborted' : 'success',
    dur: downstream.has(t.id) ? 0 : randDur(t.type) }));
}
function runDuration(results) { return Math.max(20, Math.round(results.reduce((a, r) => a + r.dur, 0) * 0.75)); }

function genHistory(seed, nodes, compute) {
  const trig = nodes.find((n) => !n.parent);
  const taskNodes = nodes.filter((n) => n.parent);
  const statuses = [...seed.runs];
  if (statuses.length >= 5) statuses.push('success', 'success', 'success', 'failed', 'success', 'success', 'success');
  const gap = cadenceMs(trig);
  const runs = statuses.map((st, k) => {
    let failAt = null, error = null;
    if (st === 'failed') {
      if (seed.failTask != null) { failAt = seed.failTask; error = seed.failError; }
      else { failAt = taskNodes.length - 1; error = ERRORS[taskNodes[failAt].type]; }
    }
    const tasks = taskResults(taskNodes, failAt);
    const dur = runDuration(tasks);
    const seq = statuses.length - 1 - k;
    const scheduled = trig && trig.type === 'scheduled';
    const trigger = !trig ? 'Manual' : scheduled && k % 6 === 5 ? 'Manual' : TRIGGER_RUN_LABEL[trig.type];
    const start = Math.round((Date.now() - (k + 0.35) * gap - Math.random() * gap * 0.1) / 60000) * 60000;
    return { id: runIdFor(seed.id, seq), seq, status: st, trigger, scope: 'full', target: null, start, dur, cus: cusFor(compute, dur), tasks, error };
  });
  return runs;
}

function newRun(p, { scope = 'full', target = null, trigger = 'Manual', tasks }) {
  const seq = p.runs.length ? Math.max(...p.runs.map((r) => r.seq)) + 1 : 0;
  return { id: runIdFor(p.id, seq), seq, status: 'running', trigger, scope, target, start: Date.now(), dur: 0, cus: 0,
    tasks: tasks.map((t) => ({ id: t.id, name: t.name, type: t.type, status: 'running', dur: 0 })), error: null };
}

function EmailChips({ value, onChange, invalid }) {
  const [text, setText] = useState('');
  const [err, setErr] = useState('');
  const commit = () => {
    const parts = text.split(/[,\s;]+/).map((x) => x.trim()).filter(Boolean);
    if (!parts.length) return true;
    const bad = parts.find((x) => !EMAIL_RE.test(x));
    if (bad) { setErr(`“${bad}” isn’t a valid email address.`); return false; }
    onChange([...value, ...parts.filter((x) => !value.includes(x))]); setText(''); setErr(''); return true;
  };
  return html`<div>
    <div className=${'chips' + (invalid || err ? ' invalid' : '')} onClick=${(e) => e.currentTarget.querySelector('input').focus()}>
      ${value.map((e) => html`<span key=${e} className="chip">${e}<button type="button" aria-label=${`Remove ${e}`} onClick=${(ev) => { ev.stopPropagation(); onChange(value.filter((x) => x !== e)); }}><${Icon} name="x" size=${12} /></button></span>`)}
      <input id="al-email" value=${text} placeholder=${value.length ? 'Add another' : 'name@company.com'} autoComplete="off"
        onChange=${(e) => { setText(e.target.value); setErr(''); }}
        onKeyDown=${(e) => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); commit(); }
          if (e.key === 'Backspace' && !text && value.length) onChange(value.slice(0, -1)); }}
        onBlur=${commit} />
    </div>
    ${err ? html`<div className="ferr"><${Icon} name="alert" size=${12} />${err}</div>` : html`<div className="fhint">Press Enter after each address.</div>`}
  </div>`;
}

/* ---------------- AI failure diagnosis ---------------- */
/* 7x7 dot-matrix loader (after ElevenLabs UI "Matrix", loader preset) */
function MatrixLoader({ rows = 7, cols = 7, size = 6, gap = 2, fps = 14 }) {
  const ref = useRef(null);
  useEffect(() => {
    const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const cells = ref.current ? Array.from(ref.current.querySelectorAll('circle')) : [];
    const cx = (cols - 1) / 2, cy = (rows - 1) / 2;
    const meta = cells.map((_, i) => { const r = Math.floor(i / cols), c = i % cols; const dx = c - cx, dy = r - cy;
      return { d: Math.hypot(dx, dy), a: Math.atan2(dy, dx) }; });
    let frame = 0, raf, last = 0;
    const draw = () => {
      const head = (frame / 12) * Math.PI * 2;
      const pulse = (Math.sin(frame / 4) + 1) / 2;
      cells.forEach((el, i) => { const m = meta[i]; let b = 0.08;
        if (m.d > 1.9 && m.d < 3.4) { let diff = head - m.a; diff = ((diff % (2 * Math.PI)) + 2 * Math.PI) % (2 * Math.PI); b = Math.max(0.08, 1 - diff / (Math.PI * 1.1)); }
        else if (m.d < 0.6) b = 0.35 + 0.65 * pulse;
        else if (m.d < 1.5) b = 0.1 + 0.25 * pulse;
        el.style.opacity = b.toFixed(2); });
    };
    const tick = (t) => { if (t - last >= 1000 / fps) { last = t; frame++; draw(); } raf = requestAnimationFrame(tick); };
    draw();
    if (!reduce) raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [rows, cols, fps]);
  const w = cols * size + (cols - 1) * gap, h = rows * size + (rows - 1) * gap;
  const dots = [];
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++)
    dots.push(html`<circle key=${r * cols + c} cx=${c * (size + gap) + size / 2} cy=${r * (size + gap) + size / 2} r=${size / 2} fill="var(--brand)" style=${{ opacity: 0.08 }} />`);
  return html`<svg ref=${ref} className="matrix" width=${w} height=${h} viewBox=${`0 0 ${w} ${h}`} role="img" aria-label="Diagnosing">${dots}</svg>`;
}

/* builds a diagnosis from the run, its history and the pipeline */
function buildDiagnosis(p, run) {
  const failedTask = run.tasks.find((t) => t.status === 'failed') || run.tasks[run.tasks.length - 1];
  const skipped = run.tasks.filter((t) => t.status === 'aborted');
  const done = p.runs.filter((r) => r.status !== 'running');
  const idx = done.findIndex((r) => r.id === run.id);
  const streak = []; for (let i = idx; i < done.length && done[i].status === 'failed'; i++) streak.push(done[i]);
  const lastGood = done.slice(idx).find((r) => r.status === 'success');
  const recovered = idx > 0 && done[idx - 1].status === 'success';
  const shortId = (r) => r.id.split('-')[1];
  const err = run.error || '';
  const steps = [
    'Diagnosing with AI…',
    `Checking ${Math.min(done.length, 12)} recent runs…`,
    `Reading the error log for ${failedTask.name}…`,
    lastGood ? `Comparing with the last successful run (${shortId(lastGood)})…` : 'Looking for a successful run to compare with…',
    'Checking upstream tasks and schema changes…',
    'Writing up what happened…',
  ];
  const streakLine = streak.length > 1
    ? `Same error in the last ${streak.length} runs (${streak.map(shortId).join(', ')}). It’s consistent, not intermittent.`
    : recovered ? 'An isolated failure. The runs just before and after it passed.' : 'The run before this one passed, so the problem started with this run.';
  const skippedLine = skipped.length ? `${skipped.map((t) => t.name).join(', ')} ${skipped.length > 1 ? 'were' : 'was'} skipped because ${skipped.length > 1 ? 'they depend' : 'it depends'} on ${failedTask.name}.` : null;

  if (/account_tier/.test(err)) {
    const acct = run.tasks.find((t) => /accounts/.test(t.name));
    return { steps, task: failedTask, kind: 'code',
      verdict: 'Needs a code change', verdictSub: 'Retrying won’t help',
      reason: [`${failedTask.name} fails because the model fct_opportunities still selects account_tier, a column that no longer exists in the Salesforce accounts data.`,
        `The column was dropped at the source about ${Math.max(1, Math.round((Date.now() - streak[streak.length - 1].start) / 86400000))} days ago, and every run since has stopped at this step.`],
      evidence: [streakLine,
        `${acct ? acct.name : 'The accounts ingestion'} succeeded in each failed run but loaded 41 columns instead of 42. account_tier is the one missing.`,
        lastGood ? `The last successful run (${shortId(lastGood)}, ${fmtDate(lastGood.start)}) still had account_tier.` : null,
        skippedLine].filter(Boolean),
      log: ['02:31:52  ERROR Database Error in model fct_opportunities (models/marts/sales/fct_opportunities.sql)', '02:31:52  ERROR   column "account_tier" does not exist'],
      next: [
        { title: 'Update fct_opportunities', body: 'Remove account_tier from models/marts/sales/fct_opportunities.sql, or replace it with the new account segment field if one was added.', action: 'open', label: `Open ${failedTask.name}` },
        { title: 'Run from failed once the fix is merged', body: 'The ingestion steps already succeeded, so only sales_marts and notify_sales_ops need to run again.', action: 'rerun', label: 'Run from failed' },
        { title: 'Ask the Salesforce admin about the change', body: 'Confirm whether account_tier was removed on purpose so the model can be updated correctly.', action: 'copy', label: 'Copy summary' },
      ] };
  }
  if (failedTask.type === 'ingestion') {
    return { steps, task: failedTask, kind: 'transient',
      verdict: 'Likely temporary', verdictSub: 'Safe to retry',
      reason: [`${failedTask.name} timed out waiting for the source to respond, so no data was loaded in this run.`,
        recovered ? 'The connector settings are unchanged and the next run succeeded, which points to a short outage on the source side.' : 'The connector settings are unchanged since the last successful run, which points to a short outage on the source side.'],
      evidence: [streakLine, 'Timeout hit after 300s while the source was still accepting connections.', lastGood ? `The last successful run (${shortId(lastGood)}) used the same connector settings.` : null, skippedLine].filter(Boolean),
      log: [`ERROR ${err}`],
      next: [
        { title: 'Retry the failed step', body: 'A rerun is likely to succeed. Nothing in the pipeline needs to change.', action: 'rerun', label: 'Run from failed' },

    setView('pipeline'); setTab('editor');
    fit(0, 120);
  }
  async function listRun(id) {
    const p = pipelines.find((x) => x.id === id);
    if (isRunning(p)) return;
    const taskNodes = p.nodes.filter((n) => TYPES[n.type].kind === 'task');
    if (!taskNodes.length) return toast(`Add a task to ${p.name} before running it.`, 'error');
    const rid = addRun(id, { tasks: taskNodes });
    toast(`Started a run of ${p.name}`, 'info');
    await sleep(2600 + Math.random() * 1200);
    const results = {}; taskNodes.forEach((n) => { results[n.id] = { status: 'success', dur: randDur(n.type) }; });
    finishRun(id, rid, 'success', results);
    patchPipeline(id, (x) => ({ nodes: x.nodes.map((n) => (results[n.id] ? { ...n, status: 'success', ran: true, duration: fmtDur(results[n.id].dur) } : n)) }));
    toast(`${p.name} ran successfully`);
  }
  function togglePause(id) {
    const p = pipelines.find((x) => x.id === id);
    if (p.pub === 'draft') return toast('Publish this pipeline before pausing it.', 'info');
    patchPipeline(id, (x) => ({ paused: !x.paused, updated: Date.now() }));
    toast(p.paused ? `${p.name} resumed. Its schedule is back on.` : `${p.name} paused. Scheduled runs are on hold.`);
  }
  function renamePipeline(id, name) {
    const old = pipelines.find((x) => x.id === id).name;
    patchPipeline(id, () => ({ name, updated: Date.now() }));
    if (id === currentId) setPipeState((s) => ({ ...s, name }));
    setModal(null);
    if (old !== name) toast(`Renamed to ${name}`);
  }
  function deletePipeline(id) {
    const idx = pipelines.findIndex((x) => x.id === id);
    const rec = pipelines[idx];
    setPipelines((ps) => ps.filter((x) => x.id !== id));
    setConfirm(null);
    if (view === 'pipeline') { setView('list'); setDrawer(null); }
    toast(`${rec.name} deleted`, 'success', { label: 'Undo', fn: () => {
      setPipelines((ps) => { const a = [...ps]; a.splice(Math.min(idx, a.length), 0, rec); return a; }); toast(`${rec.name} restored`); } });
  }
  const openNew = () => { setHint(false); setModal({ kind: 'new' }); };
  function openDiag(runId) { setDrawer(null); setMenu(null); setDiag({ runId }); }
  function diagnoseLatest() { const p = pipesRef.current.find((x) => x.id === currentId); const r = p && p.runs.find((x) => x.status === 'failed'); if (r) openDiag(r.id); }
  function diagOpenTask(nodeId) {
    setDiag(null); if (tab !== 'editor') { setTab('editor'); fit(0, 120); }
    const n = nodesRef.current.find((x) => x.id === nodeId);
    if (n) setTimeout(() => setDrawer({ view: 'config', type: n.type, editId: n.id, tab: 'logs' }), 60);
  }

  const onNodeClick = (_, n) => {
    if (Date.now() - dragRef.current < 250) return;
    if (n.id === '__ph') return setDrawer({ view: 'list', list: 'triggers' });
    actions.edit(n.id);
  };
  const fab = () => { if (busy()) return;
    if (!trigger) return setDrawer({ view: 'list', list: 'triggers' });
    const leaves = nodes.filter((n) => !nodes.some((c) => c.parent === n.id));
    setDrawer({ view: 'list', list: 'tasks', parentId: leaves[leaves.length - 1].id }); };

  const curRec = pipelines.find((p) => p.id === currentId);
  const hasChanges = pub === 'changed' || (pub === 'draft' && edited > 0);
  const diagRun = diag && curRec ? curRec.runs.find((r) => r.id === diag.runId) : null;
  const failedNode = curRec && lastDone(curRec)?.status === 'failed' ? nodes.find((n) => n.status === 'failed') : null;
  function switchTab(t) { if (t === tab) return; setMenu(null); setTab(t); if (t === 'editor') fit(0, 120); else setDrawer(null); }
  const headBadge = pub === 'draft' || pub === 'publishing' ? ['Unpublished', 'b-draft'] : paused ? ['Paused', 'b-paused'] : pub === 'changed' ? ['Unpublished changes', 'b-changed'] : ['Active', 'b-live'];
  const env = ENVS.find((e) => e.id === pipe.env);
  const nr = paused ? { text: 'Paused', muted: true } : nextRunLabel(trigger);
  const pubBadge = { draft: ['Draft', 'b-draft'], publishing: ['Draft', 'b-draft'], published: ['Published', 'b-live'], changed: ['Unpublished changes', 'b-changed'] }[pub];
  const delTarget = confirm && confirm.kind === 'delete' ? nodes.find((n) => n.id === confirm.id) : null;
  const delKids = delTarget ? nodes.filter((n) => n.parent === delTarget.id) : [];
  const delParent = delTarget ? nodes.find((n) => n.id === delTarget.parent) : null;
  const delPipe = confirm && confirm.kind === 'deletePipeline' ? pipelines.find((p) => p.id === confirm.id) : null;
  const renameRec = modal && modal.kind === 'rename' ? pipelines.find((p) => p.id === modal.id) : null;
  const curAlerts = currentId ? alertCount(currentId) : 0;

  return html`<${Ctx.Provider} value=${actions}><div className="app">
    <nav className="sidebar" aria-label="Main">
      <div className="logo" aria-label="Home"><svg width="28" height="28" viewBox="0 0 100 100" fill="none" aria-hidden="true"><path d="M23.744 88V21.962L12.084 32.562L5.724 26.414L23.744 10.09H35.616V88H23.744ZM45.474 88V84.078C45.474 80.1913 46.0747 76.34 47.276 72.524C48.4773 68.708 50.032 65.104 51.94 61.712L59.148 48.992L51.94 36.378C50.032 32.986 48.4773 29.382 47.276 25.566C46.0747 21.75 45.474 17.8987 45.474 14.012V10.09H57.24V14.012C57.24 17.0507 57.6993 20.054 58.618 23.022C59.5367 25.9193 60.738 28.7107 62.222 31.396L65.72 37.438L69.218 31.396C70.702 28.7107 71.9033 25.9193 72.822 23.022C73.7407 20.054 74.2 17.0507 74.2 14.012V10.09H85.966V14.012C85.966 17.8987 85.3653 21.75 84.164 25.566C82.9627 29.382 81.408 32.986 79.5 36.378L72.292 49.098L79.5 61.712C81.408 65.104 82.9627 68.708 84.164 72.524C85.3653 76.34 85.966 80.1913 85.966 84.078V88H74.2V84.078C74.2 81.0393 73.7407 78.0713 72.822 75.174C71.9033 72.206 70.702 69.3793 69.218 66.694L65.72 60.652L62.222 66.694C60.738 69.3793 59.5367 72.206 58.618 75.174C57.6993 78.0713 57.24 81.0393 57.24 84.078V88H45.474Z" fill="white"/></svg></div>
      <button className="avatar" onClick=${() => notInProto('Workspace switching')} aria-label="Workspace">NG</button>
      <div className="navsep"></div>
      ${[['terminal', 'Workspace'], ['plug', 'Connectors'], ['job', 'Pipelines', true], ['chart', 'Usage']].map(([i, l, on]) => html`<button key=${l} className=${'navbtn' + (on ? ' on' : '')} aria-label=${l} title=${l} onClick=${on ? goList : () => notInProto(l)}><${Icon} name=${i} size=${17} /></button>`)}
      <div className="navsep"></div>
      <button className="navbtn" aria-label="Apps" title="Apps" onClick=${() => notInProto('Apps')}><${Icon} name="grid" size=${17} /></button>
      <div className="navsep"></div>
      ${[['gauge', 'Monitoring'], ['users', 'Team'], ['shield', 'Security']].map(([i, l]) => html`<button key=${l} className="navbtn" aria-label=${l} title=${l} onClick=${() => notInProto(l)}><${Icon} name=${i} size=${17} /></button>`)}
      <div className="navfill"></div>
      ${[['settings', 'Settings'], ['help', 'Help'], ['message', 'Feedback']].map(([i, l]) => html`<button key=${l} className="navbtn" aria-label=${l} title=${l} onClick=${() => notInProto(l)}><${Icon} name=${i} size=${17} /></button>`)}
    </nav>

    <main className="main">
      ${view === 'pipeline' ? html`<header className="header phead">
        <div className="h-left">
          <${Tip} label="Back to pipelines"><button className="iconbtn" aria-label="Back to pipelines" onClick=${goList}><${Icon} name="chevL" size=${18} /></button></${Tip}>
          <div className="tabseg" role="tablist" aria-label="Pipeline view">
            <button role="tab" id="tab-runs" aria-selected=${tab === 'runs'} className=${tab === 'runs' ? 'on' : ''} onClick=${() => switchTab('runs')}>Past runs</button>
            <button role="tab" id="tab-editor" aria-selected=${tab === 'editor'} className=${tab === 'editor' ? 'on' : ''} onClick=${() => switchTab('editor')}>Editor</button>
          </div>
        </div>
        <div className="h-center">
          ${renaming ? html`<input id="rename" className="inp rename" defaultValue=${pipe.name} autoFocus=${true}
              onBlur=${(e) => { const v = e.target.value.trim(); if (v && v !== pipe.name) { setPipe({ name: v }); toast('Pipeline renamed'); } setRenaming(false); }}
              onKeyDown=${(e) => { if (e.key === 'Enter') e.target.blur(); if (e.key === 'Escape') setRenaming(false); }} />`
            : html`<h1 className="h-title" title="Click to rename" onClick=${() => setRenaming(true)}>${pipe.name}</h1>`}
          <span className=${'pubbadge ' + headBadge[1]}><span className="dot"></span>${headBadge[0]}</span>
        </div>
        <div className="h-right">
          <${Tip} label=${curAlerts ? `${curAlerts} alert${curAlerts > 1 ? 's' : ''} set` : 'No alerts set'}>
            <button className=${'bellchip' + (curAlerts ? ' on' : '')} aria-label=${curAlerts ? `${curAlerts} alerts set` : 'No alerts set'} onClick=${() => openAlerts(currentId)}>
              <${Icon} name="bell" size=${16} fill=${curAlerts ? 'currentColor' : 'none'} />${curAlerts > 0 && html`<span>${curAlerts}</span>`}</button></${Tip}>
          ${run ? html`<div className="runpill"><span className="spin"></span>Running…
              <${Tip} label="Stop run"><button className="stopbtn" aria-label="Stop run" onClick=${() => { runRef.current.stop = true; }}><${Icon} name="stop" size=${11} color="#F04438" /></button></${Tip}></div>`
            : html`<div className="split">
              <button className="btn btn-sec" onClick=${() => runPipeline(false)}><${Icon} name="play" size=${14} />Run now</button>
              <button className="btn btn-sec caret" aria-label="More run options" onClick=${(e) => { e.stopPropagation(); setMenu(menu === 'run' ? null : 'run'); }}><${Icon} name="chevD" size=${15} /></button>
              ${menu === 'run' && html`<div className="menu right" role="menu">
                <button role="menuitem" onClick=${() => runPipeline(false)}><${Icon} name="play" size=${14} />Run now</button>
                <button role="menuitem" onClick=${() => runPipeline(true)}><${Icon} name="reset" size=${14} />Run from failed</button></div>`}
            </div>`}
          <button className=${'btn ' + (hasChanges || pub === 'publishing' ? 'btn-pri' : 'btn-sec') + (pub === 'publishing' ? ' publishing' : '')} disabled=${pub === 'publishing'} onClick=${publish}
              title=${hasChanges ? '' : 'No changes to publish'}>
            ${pub === 'publishing' ? html`<span className="spin light"></span>Publishing…` : html`<${Icon} name="send" size=${14} />Publish`}</button>
          <div className="split">
            <button className="iconbtn bordered" aria-label="More actions" onClick=${(e) => { e.stopPropagation(); setMenu(menu === 'more' ? null : 'more'); }}><${Icon} name="more" size=${18} /></button>
            ${menu === 'more' && html`<div className="menu right" role="menu">
              <button role="menuitem" onClick=${() => setRenaming(true)}><${Icon} name="pencil" size=${14} />Rename pipeline</button>
              ${pub !== 'draft' && html`<button role="menuitem" onClick=${() => { setPaused(!paused); setEdited(Date.now()); toast(paused ? 'Pipeline resumed' : 'Pipeline paused. Scheduled runs are on hold.'); }}>
                <${Icon} name=${paused ? 'play' : 'pause'} size=${14} />${paused ? 'Resume pipeline' : 'Pause pipeline'}</button>`}
              <div className="menusep"></div>
              <button role="menuitem" className="danger" onClick=${() => { if (!busy()) setConfirm({ kind: 'deletePipeline', id: currentId }); }}><${Icon} name="trash" size=${14} />Delete pipeline</button></div>`}
          </div>
        </div>
      </header>` : html`<header className="header"><div className="h-left"><h1 className="h-title static">Pipelines</h1></div>
        <div className="h-right">
          ${hint && html`<span className="newhint" aria-hidden="true">Start here: build a pipeline from scratch<${Icon} name="arrowRight" size=${14} sw=${2} /></span>`}
          <button className=${'btn btn-pri' + (hint ? ' ringing' : '')} onClick=${openNew}><${Icon} name="plus" size=${15} />New Pipeline</button></div></header>`}

      ${view === 'pipeline' && tab === 'runs' ? html`<${RunsView} key=${currentId} p=${curRec} activeRunId=${run ? run.id : null}
            onStop=${() => { if (runRef.current) runRef.current.stop = true; }} onRunNow=${() => runPipeline(false)} onRunFromFailed=${() => runPipeline(true)}
            onOpenEditor=${() => switchTab('editor')} onDiagnose=${openDiag} trigger=${trigger} nextRun=${nr} />`
      : view === 'pipeline' ? html`<div className=${'canvas' + (!drawer && !diag && settingsOpen ? ' docked' : '')}>
          ${failedNode && !run && !diag && html`<div className="failchip-canvas">
            <span className="dot"></span><span>Last run failed at <b>${failedNode.name}</b></span>
            <button className="btn btn-ai btn-sm" onClick=${diagnoseLatest}><${Icon} name="sparkles" size=${13} />Diagnose with AI</button></div>`}
          <${Flow} nodes=${rfNodes} edges=${edges} nodeTypes=${nodeTypes} onNodesChange=${onNodesChange} onNodeClick=${onNodeClick}
            onNodeDragStart=${() => { dragRef.current = Date.now() + 1e9; }} onNodeDragStop=${() => { dragRef.current = Date.now(); }}
            nodesConnectable=${false} elementsSelectable=${false} deleteKeyCode=${null} selectionKeyCode=${null} multiSelectionKeyCode=${null}
            zoomOnScroll=${false} panOnScroll=${true} preventScrolling=${true} zoomOnPinch=${true} zoomOnDoubleClick=${false}
            minZoom=${0.3} maxZoom=${1.5} fitView=${true} fitViewOptions=${{ maxZoom: 1, padding: 0.35 }} nodeDragThreshold=${3}
            proOptions=${{ hideAttribution: true }}>
            ${Background && html`<${Background} gap=${16} size=${1.1} color="#CDD2DC" />`}
          </${Flow}>
          <${ZoomBar} />
          <${Tip} label=${trigger ? 'Add a task' : 'Add a trigger'}><button className="fab" aria-label=${trigger ? 'Add a task' : 'Add a trigger'} onClick=${fab}><${Icon} name="plus" size=${18} sw=${2.2} /></button></${Tip}>
          ${!drawer && !diag && (settingsOpen ? html`<${SettingsPanel} pipe=${pipe} setPipe=${setPipe} trigger=${trigger} paused=${paused} toast=${toast} onCollapse=${() => setSettingsOpen(false)} />`
            : html`<button className="sp-open" onClick=${() => setSettingsOpen(true)}><${Icon} name="settings" size=${15} />Pipeline settings</button>`)}
          ${drawer && html`<aside className="drawer" aria-label="Configure node" key=${drawer.view + (drawer.type || '') + (drawer.editId || '') + (drawer.tab || '')}>
            ${drawer.view === 'list'
              ? html`<${NodeList} list=${drawer.list} onClose=${() => setDrawer(null)} onPick=${(type) => setDrawer({ ...drawer, view: 'config', type })} />`
              : html`<${ConfigForm} drawer=${{ ...drawer, toast }} nodes=${nodes} onClose=${() => setDrawer(null)}
                  onBack=${() => setDrawer({ view: 'list', list: TYPES[drawer.type].kind === 'trigger' ? 'triggers' : 'tasks', parentId: drawer.parentId })}
                  onSave=${saveNode} onTest=${testStep} />`}
          </aside>`}
        </div>`
        : html`<${PipelinesList} pipelines=${pipelines.map((p) => ({ ...p, alerts: alertCount(p.id) }))} onOpen=${openPipeline} onRun=${listRun} onTogglePause=${togglePause}
            onRename=${(id) => setModal({ kind: 'rename', id })} onDelete=${(id) => setConfirm({ kind: 'deletePipeline', id })} onNew=${openNew} onAlerts=${openAlerts} />`}
      ${view === 'pipeline' && diagRun && html`<${DiagnosisPanel} key=${diagRun.id} p=${curRec} run=${diagRun} toast=${toast}
          canRerun=${!run && lastDone(curRec)?.id === diagRun.id} onClose=${() => setDiag(null)} onOpenTask=${diagOpenTask}
          onRerun=${() => { setDiag(null); runPipeline(true); }} />`}
      ${alertsFor && html`<${AlertsDrawer} state=${alertsFor} setState=${setAlertsFor} pipelines=${pipelines} alerts=${alerts}
          onSave=${saveAlert} onDelete=${(a) => setConfirm({ kind: 'deleteAlert', alert: a })} onClose=${closeAlerts} closing=${alertsClosing} />`}
    </main>

    ${modal && modal.kind === 'new' && html`<${NameModal} mode="create" taken=${pipelines.map((p) => p.name)} onSubmit=${createPipeline} onCancel=${() => setModal(null)} />`}
    ${renameRec && html`<${NameModal} mode="rename" initial=${renameRec.name} taken=${pipelines.map((p) => p.name)} onSubmit=${(n) => renamePipeline(renameRec.id, n)} onCancel=${() => setModal(null)} />`}
    ${delPipe && html`<${ConfirmModal} danger=${true} icon="trash" title=${`Delete ${delPipe.name}?`} confirmLabel="Delete pipeline"
      body=${html`<span>Its schedule stops and its ${delPipe.nodes.length} step${delPipe.nodes.length === 1 ? '' : 's'} and run history are removed. You can undo this for a few seconds.</span>`}
      onCancel=${() => setConfirm(null)} onConfirm=${() => deletePipeline(delPipe.id)} />`}
    ${confirm && confirm.kind === 'deleteAlert' && html`<${ConfirmModal} danger=${true} icon="trash" title=${`Delete ${confirm.alert.name}?`} confirmLabel="Delete alert"
      body=${`${confirm.alert.slack || 'Its recipients'} will stop getting these notifications${confirm.alert.pipelines.length > 1 ? ` for all ${confirm.alert.pipelines.length} pipelines` : ''}.`}
      onCancel=${() => setConfirm(null)} onConfirm=${() => removeAlert(confirm.alert)} />`}
    ${delTarget && html`<${ConfirmModal} danger=${true} icon="trash" title=${`Delete ${delTarget.name}?`} confirmLabel="Delete"
      body=${delKids.length ? html`<span>${delKids.length === 1 ? `${delKids[0].name} depends on it` : `${delKids.length} tasks depend on it`}. ${delKids.length === 1 ? 'It' : 'They'} will run after <b>${delParent ? delParent.name : 'the trigger'}</b> instead.</span>` : 'This removes the step and its configuration from the pipeline.'}
      onCancel=${() => setConfirm(null)} onConfirm=${() => { setConfirm(null); doDelete(delTarget.id); }} />`}
    ${confirm && confirm.kind === 'publish' && html`<${ConfirmModal} icon="send" title=${`Publish ${pipe.name}?`} confirmLabel="Publish"
      body=${html`<div className="pubsum">
        <div><span>Environment</span><b>${env.label}</b></div>
        <div><span>Trigger</span><b>${trigger.name}</b></div>
        <div><span>Tasks</span><b>${tasks.length}</b></div>
        <div><span>Compute</span><b>${COMPUTE.find((c) => c.id === pipe.compute).label}</b></div>
        <div><span>Time out</span><b>${pipe.timeoutOn ? `${pipe.timeout} ${pipe.timeoutUnit}` : 'None'}</b></div>
        <div><span>Concurrent runs</span><b>${pipe.concurrencyOn ? `Up to ${pipe.concurrency}` : '1 at a time'}</b></div>
        <div><span>Next run</span><b>${nr.text}</b></div></div>`}
      onCancel=${() => setConfirm(null)} onConfirm=${doPublish} />`}

    <div className="toasts" aria-live="polite">${toasts.map((t) => html`<div key=${t.id} className=${'toast t-' + t.tone}>
      <${Icon} name=${t.tone === 'error' ? 'alert' : t.tone === 'info' ? 'info' : 'checkCircle'} size=${16} /><span>${t.msg}</span>
      ${t.action && html`<button onClick=${() => { t.action.fn(); setToasts((x) => x.filter((y) => y.id !== t.id)); }}>${t.action.label}</button>`}</div>`)}</div>

    ${narrow && !forceDesktop && html`<div className="gate"><div className="gate-card">
      <${Icon} name="monitor" size=${28} color="#7F56D9" />
      <h2>Best viewed on desktop</h2>
      <p>This pipeline builder is a desktop tool. Open it on a wider screen to drag, zoom and configure nodes comfortably.</p>
      <button className="btn btn-pri" onClick=${() => { let embedded = true; try { embedded = window.self !== window.top; } catch (_) {}
        if (embedded) { const u = new URL(location.href); u.searchParams.set('full', '1'); window.open(u.toString(), '_blank', 'noopener'); }
        else setForceDesktop(true); }}>Open full screen</button></div></div>`}
  </div></${Ctx.Provider}>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${ReactFlowProvider}><${App} /></${ReactFlowProvider}>`);

</script>

</body></html>
